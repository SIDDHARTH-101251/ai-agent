apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-agent-ingress
  namespace: ai-agent
  annotations:
    # Optional: increase body size if you post large payloads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: ai-agent.local
      http:
        paths:
          # Frontend (React+Nginx)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-agent-frontend
                port:
                  number: 80

          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ai-agent-backend
                port:
                  number: 8000

          # (Optional) direct health endpoint
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: ai-agent-backend
                port:
                  number: 8000
