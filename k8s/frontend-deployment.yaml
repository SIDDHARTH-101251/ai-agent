apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-frontend
  namespace: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-frontend
  template:
    metadata:
      labels:
        app: ai-agent-frontend
    spec:
      containers:
        - name: frontend
          image: siddharth101/ai-agent-frontend:latest
          ports:
            - containerPort: 80
