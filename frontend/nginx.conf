server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests to FastAPI Service in the same namespace
    location /api/ {
        proxy_pass http://ai-agent-backend:8000;  # no trailing slash; keeps /api prefix
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct health endpoint
    location /healthz {
        proxy_pass http://ai-agent-backend:8000/healthz;
    }
}